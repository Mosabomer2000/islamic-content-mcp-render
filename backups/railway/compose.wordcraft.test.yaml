# Local-only smoke testing. Do not route an untested container to public traffic.
services:
  wordcraft-test:
    build:
      context: .
      dockerfile: Dockerfile.wordcraft
    environment:
      MCP_TOKEN: ${MCP_TOKEN:?Provide a strong private token via local environment}
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    read_only: false
    security_opt:
      - no-new-privileges:true
    restart: "no"
