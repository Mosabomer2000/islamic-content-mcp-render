services:
  - type: web
    runtime: node
    name: islamic-content-mcp-remote
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
